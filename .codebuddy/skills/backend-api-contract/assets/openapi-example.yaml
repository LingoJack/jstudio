openapi: 3.0.3
info:
  title: JStudio 后端接口
  version: "1.0.0"
  description: 接口契约唯一事实源。需求背景见 reqs/ 下按 x-requirement 关联的需求文档。
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
tags:
  - name: documents
    description: 文档快照的远程保存与回看
paths:
  /documents/{docId}:
    put:
      operationId: doc-put-snapshot
      summary: 上传一份文档快照
      tags:
        - documents
      security:
        - bearerAuth: []
      x-requirement: req-2026-0910-remote-save
      x-status: implemented
      x-owner: jack
      x-created: "2026-09-08"
      x-updated: "2026-09-10"
      x-background: 桌面端只有本地文件，换机器就丢；需要一个按 docId 追加快照的写入口，服务端保留历史版本供回看
      x-expected: 每次调用追加一个新快照，revision 从 1 起自增，绝不覆盖旧快照；同一 docId 首次调用即建档；body 原样存储不解析结构，因此桌面端文档格式演进不需要改后端；成功返回新快照的 revision 与字节数
      parameters:
        - name: docId
          in: path
          required: true
          description: 文档标识，由桌面端生成的稳定 id，作用域是当前用户
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 文档标题，仅用于列表展示，可为空串
                body:
                  type: object
                  additionalProperties: true
                  description: 文档正文的完整 JSON，服务端原样落库不校验内部结构，上限 8MiB（含字段名）
              required:
                - body
      responses:
        "201":
          description: 已写入新快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc_id:
                    type: string
                    description: 回显的文档标识，与请求路径一致
                  revision:
                    type: integer
                    description: 本次写入产生的快照版本号，从 1 起自增
                  size_bytes:
                    type: integer
                    description: 本次 body 落库后的字节数
                  created_at:
                    type: string
                    description: 快照写入时间，RFC3339
                required:
                  - doc_id
                  - revision
                  - size_bytes
                  - created_at
        "400":
          description: 请求体不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_REQUEST
                  message: invalid json body
          x-errors:
            - code: INVALID_REQUEST
              message: invalid json body
              when: body 不是合法 JSON，或 body 字段缺失/为空
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: UNAUTHORIZED
                  message: unauthorized
          x-errors:
            - code: UNAUTHORIZED
              message: unauthorized
              when: 缺 Authorization 头或 token 解析失败
        "413":
          description: 请求体过大
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: document body too large
          x-errors:
            - code: PAYLOAD_TOO_LARGE
              message: document body too large
              when: 请求体超过 8MiB
        "500":
          description: 服务端异常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL
                  message: internal server error
          x-errors:
            - code: INTERNAL
              message: internal server error
              when: 落库失败等服务端异常，细节只进服务端日志不返回客户端
      x-impl:
        handler: backend/internal/api/documents_handler.go:36
        verified: "2026-09-10"
        notes: 8MiB 上限取自 maxDocumentRequestBytes，已核对

  /documents/{docId}/snapshots:
    get:
      operationId: doc-snapshot-list
      summary: 列出一份文档的快照历史
      tags:
        - documents
      security:
        - bearerAuth: []
      x-requirement: req-2026-0910-remote-save
      x-status: implemented
      x-owner: jack
      x-created: "2026-09-09"
      x-updated: "2026-09-10"
      x-background: 远程保存写入历史后，桌面端要能看到有哪些版本可回看，只需要元信息不需要正文
      x-expected: 按 revision 倒序返回快照元信息，只含 revision/大小/时间，不含正文；limit 缺省 50，超过 200 按 200 截断而不报错；total 是该文档快照总数，与本次返回条数无关；文档不存在返回 404
      parameters:
        - name: docId
          in: path
          required: true
          description: 文档标识，作用域是当前用户
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 返回条数上限，缺省 50，最大 200（超出按 200 截断），必须为正整数
          schema:
            type: integer
      responses:
        "200":
          description: 快照元信息列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: 该文档的快照总数，不受 limit 影响
                  snapshots:
                    type: array
                    description: 快照元信息，按 revision 倒序
                    items:
                      type: object
                      properties:
                        revision:
                          type: integer
                          description: 快照版本号
                        size_bytes:
                          type: integer
                          description: 该快照正文字节数
                        created_at:
                          type: string
                          description: 写入时间，RFC3339
                      required:
                        - revision
                        - size_bytes
                        - created_at
                required:
                  - total
                  - snapshots
        "400":
          description: 查询参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_REQUEST
                  message: limit must be a positive integer
          x-errors:
            - code: INVALID_REQUEST
              message: limit must be a positive integer
              when: limit 不是正整数
        "401":
          description: 未登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: UNAUTHORIZED
                  message: unauthorized
          x-errors:
            - code: UNAUTHORIZED
              message: unauthorized
              when: 缺 Authorization 头或 token 解析失败
        "404":
          description: 文档不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: document not found
          x-errors:
            - code: NOT_FOUND
              message: document not found
              when: docId 不存在，或不属于当前用户
        "500":
          description: 服务端异常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL
                  message: internal server error
          x-errors:
            - code: INTERNAL
              message: internal server error
              when: 查询失败等服务端异常
      x-impl:
        handler: backend/internal/api/documents_handler.go:94
        verified: "2026-09-10"
        notes: limit 截断行为已核对

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 登录态 access token，缺失或过期按未登录处理
    internalAuth:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 仅服务间调用，token 由部署侧注入
  schemas:
    Error:
      type: object
      description: 统一错误响应体，所有非 2xx 响应都是这个形状
      properties:
        error:
          type: object
          description: 错误主体
          properties:
            code:
              type: string
              description: 错误码常量，UPPER_SNAKE_CASE
            message:
              type: string
              description: 面向调用方的错误描述，与代码里返回的字符串一致
          required:
            - code
            - message
      required:
        - error
