[package]
name = "jstudio"
version = "0.1.0"
description = "j Reader desktop app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[workspace]
