# k3s 集群内自建的镜像仓库（匿名 http，只对内网暴露）。
# 镜像由 build/Makefile 推上来，Pod 从这个 registry 拉取。
# 应用方式：make -C deploy registry-up
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  labels:
    app.kubernetes.io/name: registry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
          env:
            # 允许删 tag，方便清理旧镜像释放 PVC 空间。
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  # NodePort 是为了让 podman（集群外）也推得进来；Pod 内部用 DNS 名 registry:5000 更稳。
  # 改 nodePort 要同步 build/Makefile 与 deploy/Makefile 的 REGISTRY_NODEPORT，
  # 以及每个节点上的 /etc/rancher/k3s/registries.yaml（镜像名必须与那里逐字相同）。
  type: NodePort
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
      protocol: TCP
  selector:
    app.kubernetes.io/name: registry
