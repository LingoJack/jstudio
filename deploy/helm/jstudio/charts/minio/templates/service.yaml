{{/*
只暴露在集群内：backend 通过 <release>-minio:9000 访问。
看控制台用 kubectl port-forward，不额外对外开端口。
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minio.fullname" . }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
    - name: console
      port: {{ .Values.service.consolePort }}
      targetPort: console
      protocol: TCP
  selector:
    {{- include "minio.selectorLabels" . | nindent 4 }}
