apiVersion: v1
kind: Service
metadata:
  name: {{ include "jstudio.fullname" . }}
  labels:
    {{- include "jstudio.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # k3s 自带 klipper-lb 就能分配 LoadBalancer IP；需要独立 IP 段时先装 MetalLB。
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "jstudio.selectorLabels" . | nindent 4 }}
