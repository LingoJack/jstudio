{{/*
Secret 日常由 deploy/Makefile 的 secret-ensure 建（避免每次 upgrade 轮换 jwt_secret），
此时 secret.existingSecret 非空，这里不渲染任何东西。
*/}}
{{- if not .Values.secret.existingSecret }}
{{- $accessKey := .Values.secret.storageAccessKey }}
{{- $secretKey := .Values.secret.storageSecretKey }}
{{- if and .Values.minio.enabled (not $accessKey) }}
{{- $accessKey = .Values.minio.auth.rootUser }}
{{- $secretKey = .Values.minio.auth.rootPassword }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jstudio.secretName" . }}
  labels:
    {{- include "jstudio.labels" . | nindent 4 }}
type: Opaque
stringData:
  JS_AUTH_JWT_SECRET: {{ required "secret.jwtSecret 必填（openssl rand -base64 48）" .Values.secret.jwtSecret | quote }}
  JS_DATABASE_PASSWORD: {{ .Values.secret.databasePassword | quote }}
  JS_STORAGE_ACCESS_KEY: {{ required "secret.storageAccessKey 必填（或开启 minio 子 chart）" $accessKey | quote }}
  JS_STORAGE_SECRET_KEY: {{ required "secret.storageSecretKey 必填（或开启 minio 子 chart）" $secretKey | quote }}
{{- end }}
