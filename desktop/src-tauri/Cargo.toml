[package]
name = "jstudio"
version = "0.1.0"
description = "JStudio backend (Electron sidecar: storage/PTY/agent/link)"
authors = ["Jack Lingo"]
edition = "2024"

[workspace]

[lib]
name = "jstudio_lib"
crate-type = ["rlib"]

# Headless backend for the Electron shell (stdio JSON-RPC).
[[bin]]
name = "jstudio-sidecar"
path = "src/bin/sidecar.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── j-agent (Agent engine — the reason this sidecar still exists) ──
j_agent = { path = "../jcli/j-agent", package = "j-agent" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
