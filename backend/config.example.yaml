server:
  addr: "127.0.0.1:8080"        # 部署到服务器时改为 0.0.0.0:8080 或置于反代后
database:
  path: "data/jstudio-backend.db"
auth:
  jwt_secret: ""                # 必填，至少 32 字节；生成：openssl rand -base64 48
  token_ttl: "720h"             # 30 天，桌面端免频繁重登
storage:
  endpoint: "127.0.0.1:9000"    # 与 ../minio/docker-compose.yml 对齐
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "jstudio"
  use_ssl: false
